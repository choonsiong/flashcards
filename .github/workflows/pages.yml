name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a queued run supersede an in-progress one, but never cancel a live deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Rebuild the CSS so a deploy can never ship stale styles, even if the
      # committed styles.css was forgotten after a markup change.
      - run: npm run build

      - name: Fail if styles.css is out of date
        run: |
          if ! git diff --quiet -- styles.css; then
            echo "::error::styles.css is out of date. Run 'npm run build' and commit the result."
            git diff --stat -- styles.css
            exit 1
          fi

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: .
          # v4 onwards drops dotfiles from the artifact by default, which would
          # silently stop deploying .nojekyll.
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
